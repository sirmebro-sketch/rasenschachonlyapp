<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <!-- VERGROESSERN IST WIEDER ERLAUBT (35.142, F51).

         Hier stand `maximum-scale=1,user-scalable=no`, mit der Begruendung:
         die App bringe unter „Optionen" eine eigene Textgroesse mit, also
         leide die Barrierefreiheit nicht.

         Die Begruendung war falsch — nachgemessen: die eigene Skala reichte
         von 0,92 bis 1,12, also hoechstens +12 %. Wer 200 % braucht, bekam
         12 % und durfte nicht zoomen. Das ist kein Ersatz, sondern eine
         Sperre mit Trostpflaster.

         Der urspruengliche Anlass bleibt richtig: versehentliches Zoomen
         beim Wischen ist stoerend. Dagegen hilft `touch-action` im
         Stilblock, das gezielt Doppeltipp- und Pinch-Gesten auf den
         Spielflaechen abfaengt — nicht eine Sperre fuer das ganze Dokument.
         Wer bewusst zoomt, soll es koennen. -->
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#070D0A" />
    <!-- Grundfarbe: Rasen bei Nacht, gleich wie --bg in App.jsx. Weicht sie ab,
         blitzt beim Start kurz die falsche Farbe auf. -->
    <title>Rasenschach XI</title>
    <style>
      html, body, #root { margin: 0; padding: 0; background: #070D0A; min-height: 100%; }
      /* pan-x pan-y laesst Wischen zu, aber kein Aufziehen mit zwei Fingern
         und kein Zoomen per Doppeltipp. Letzteres nimmt dem Spielerpass auch
         die Verzoegerung beim Wenden. */
      html { touch-action: pan-x pan-y; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
      body { overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
             touch-action: pan-x pan-y; }

      /* Das Startbild liegt absichtlich direkt im HTML statt erst in React:
         Nach dem kurzen systemseitigen Android-Start kann die lokale WebView
         sofort Kevins app-eigenes Motiv anzeigen. */
      #app-startup-splash {
        position: fixed; inset: 0; z-index: 2147483647; overflow: hidden;
        background: #050706; opacity: 1; transition: opacity 280ms ease;
      }
      #app-startup-splash img {
        width: 100%; height: 100%; display: block; object-fit: cover;
        object-position: center center; user-select: none; -webkit-user-drag: none;
      }
      #app-startup-splash .startup-spinner {
        position: absolute; left: 50%; top: 64%; width: 34px; height: 34px;
        margin: -17px 0 0 -17px; box-sizing: border-box; border-radius: 50%;
        border: 3px solid rgba(246, 244, 232, .34);
        border-top-color: #f6f4e8; border-right-color: #b91f1b;
        filter: drop-shadow(0 0 8px rgba(0,0,0,.65));
        animation: startup-spin 850ms linear infinite;
      }
      #app-startup-splash.is-hiding { opacity: 0; pointer-events: none; }
      @keyframes startup-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #app-startup-splash { transition-duration: 120ms; }
        #app-startup-splash .startup-spinner { animation: none; }
      }
    </style>
  </head>
  <body>
    <script>window.__RASENSCHACH_SPLASH_STARTED__ = performance.now();</script>
    <div id="app-startup-splash" role="status" aria-label="Rasenschach XI wird geladen">
      <img
        alt=""
        src="__RASENSCHACH_STARTBILD__"
        loading="eager"
        fetchpriority="high"
        decoding="sync"
      />
      <span class="startup-spinner" aria-hidden="true"></span>
    </div>
    <div id="root"></div>
    <script type="module" src="./main.jsx"></script>
  </body>
</html>
