name: Spielregressionen
on:
  pull_request:
  push:
    branches: [main]
  # Von Hand startbar, damit ein Branch ohne Pull Request pruefbar ist:
  # Actions -> Spielregressionen -> Run workflow -> Branch waehlen.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
