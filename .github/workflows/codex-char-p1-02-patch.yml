name: Codex CHAR-P1-02 Renderer-Patch
on:
  push:
    branches: [codex/char-p1-02-gesichtszuege]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/char-p1-02-gesichtszuege
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/char-p1-02-produktionspatch.cjs
      - name: Commit targeted App.jsx change
        shell: bash
        run: |
          if git diff --quiet -- App.jsx; then
            echo "Kein weiterer Patch nötig."
            exit 0
          fi
          git config user.name "ChatGPT Codex Connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.jsx
          git commit -m "CHAR-P1-02: Gesichtszüge im Renderer differenzieren"
          git push origin HEAD:codex/char-p1-02-gesichtszuege
