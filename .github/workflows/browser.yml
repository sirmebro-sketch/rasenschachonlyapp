name: Visuelle Browsertests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run preview:gallery
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Rasenschach-Browsertest
          path: |
            playwright-report/
            test-results/
            .preview/sichtprobe.html
          include-hidden-files: true
          retention-days: 14
