name: CHAR P1 01 Patchlauf
on:
  push:
    branches:
      - codex/char-p1-01
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/char-p1-01
      - name: Produktionscode patchen
        run: python3 tools/char-p1-01-patch.py
      - name: Temporäre Patchhilfen entfernen und committen
        run: |
          rm tools/char-p1-01-patch.py
          rm .github/workflows/char-p1-01-patch.yml
          git config user.name "ChatGPT Codex"
          git config user.email "noreply@openai.com"
          git add App.jsx tools/char-p1-01-patch.py .github/workflows/char-p1-01-patch.yml
          git commit -m "CHAR-P1-01: Kopfsilhouetten append-only erweitern"
          git push origin HEAD:codex/char-p1-01
