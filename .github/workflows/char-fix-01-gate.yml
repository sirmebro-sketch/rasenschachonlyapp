name: CHAR FIX 01 Vollgate
on:
  push:
    branches:
      - codex/char-fix-01-kopf-hals-frisur
    paths:
      - .github/workflows/char-fix-01-gate.yml
permissions:
  contents: write
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/char-fix-01-kopf-hals-frisur
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Abhaengigkeiten
        run: npm ci --no-audit --no-fund
      - name: Regressionen
        run: npm test
      - name: Web-Build
        run: npm run build
      - name: Browser vorbereiten
        run: npx playwright install --with-deps chromium
      - name: Sichtgalerien erzeugen
        run: npm run preview:gallery
      - name: Browser-Regressionen inklusive CHAR-FIX-01
        run: npm run test:browser
      - name: Android synchronisieren und Debug-APK bauen
        run: |
          set -euo pipefail
          npx --no-install cap sync android
          node tools/android-version.cjs android/app/build.gradle package.json
          cd android
          ./gradlew assembleDebug --no-daemon
      - name: Fokussierte Sichttafel erzeugen
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mapfile -t SHOTS < <(find test-results -type f -name 'char-fix-01-kopf-*-kritisch.png' | sort)
          test "${#SHOTS[@]}" -eq 4 || { printf 'Erwartet 4 kritische Screenshots, gefunden %s\n' "${#SHOTS[@]}"; exit 1; }
          mkdir -p pruefberichte/artefakte
          montage "${SHOTS[@]}" -tile 2x2 -geometry 520x+10+10 -background '#101814' /tmp/charfix-contact.png
          convert /tmp/charfix-contact.png -resize '900x>' -quality 42 pruefberichte/artefakte/2026-09-17-char-fix-01-neue-koepfe.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: CHAR-FIX-01-Pruefstand
          path: |
            test-results/
            .preview/char-fix-01.html
            android/app/build/outputs/apk/debug/app-debug.apk
            pruefberichte/artefakte/2026-09-17-char-fix-01-neue-koepfe.jpg
          include-hidden-files: true
          retention-days: 14
      - name: Sichttafel sichern und Gate-Hilfe entfernen
        run: |
          set -euo pipefail
          rm .github/workflows/char-fix-01-gate.yml
          git config user.name "ChatGPT Codex"
          git config user.email "noreply@openai.com"
          git add pruefberichte/artefakte/2026-09-17-char-fix-01-neue-koepfe.jpg .github/workflows/char-fix-01-gate.yml
          git commit -m "CHAR-FIX-01: reproduzierbare Sichttafel sichern"
          git push origin HEAD:codex/char-fix-01-kopf-hals-frisur
